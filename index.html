 document.querySelectorAll('.formula').forEach((e,i)=>e.textContent=(isNewton||i?'z₀ = z':'z₀ = 0')+' · '+eq+(isNewton?' · P(z) = ∏(z − rₖ)':state.family==='phoenix'?' · z₋₁ = 0':''));
 populateWiki();$('familyWiki').textContent=names[0]+(state.family==='phoenix'?' · Ultra Fractal ↗':' · Wikipedia ↗');
 document.querySelectorAll('.equation p').forEach((e,i)=>e.textContent=isNewton?tr('rootsEq'):state.family==='phoenix'?tr('phoenixEq'):state.family==='ship'?tr('shipEq'):state.family==='multibrot'&&!i?tr('multiEq'):tr(i?'juliaEq':'mandelEq'));
 document.querySelector('[data-t="smooth"]').textContent=isNewton?tr('flowHelp'):tr('smooth').replaceAll('log₂','log'+(state.family==='multibrot'?state.degree:'₂'));
 canvases.forEach((c,i)=>c.setAttribute('aria-label',names[i]+'. '+tr(isNewton?'newtonHelp':'help')+' '+tr(isNewton?'newtonKeyboard':'keyboard')));
 document.querySelectorAll('[data-zoom]').forEach(b=>b.setAttribute('aria-label',tr(+b.dataset.zoom<1?'zoomIn':'zoomOut')+' '+names[+b.dataset.view]));
 document.querySelectorAll('[data-home]').forEach(b=>b.setAttribute('aria-label',tr('home')+' '+names[+b.dataset.home]));
}
$('family').onchange=e=>{flushHistory();state.family=e.target.value;state.m=state.family==='newton'?[0,0,3.6]:[-.5,0,3.6];state.j=state.family==='newton'?[0,0,1.2]:[0,0,3.6];state.c=state.family==='newton'?[0,0]:state.family==='ship'?[-1.76,-.03]:state.family==='phoenix'?[.56667,0]:[-.745,.186];sync();change(2);notice(state.family==='newton'?'newtonHelp':'help')};$('degree').onchange=e=>{state.degree=+e.target.value;state.roots=[];sync();change(2)};


let rootDragging=false;
function currentRoots(){return state.roots.length===state.degree?state.roots:Array.from({length:state.degree},(_,k)=>[Math.cos(2*Math.PI*k/state.degree),Math.sin(2*Math.PI*k/state.degree)])}
function moveRoot(k,p){if(state.roots.length!==state.degree)state.roots=currentRoots();state.roots[k]=p.map(v=>Math.max(-20,Math.min(20,v)));draw()}
function updateRootMarkers(){
 for(let view=0;view<2;view++){
  const plane=canvases[view].parentElement;let overlay=plane.querySelector('.root-overlay');
  if(!overlay){overlay=document.createElement('div');overlay.className='root-overlay';plane.append(overlay)}
  overlay.hidden=true;if(overlay.hidden)continue;
  const roots=currentRoots(),v=state[view?'j':'m'],r=plane.getBoundingClientRect();
  if(overlay.children.length!==roots.length){overlay.replaceChildren();roots.forEach((_,k)=>{
   const b=document.createElement('button');b.className='root-handle';b.textContent='';b.type='button';overlay.append(b);let dragging=false;
   b.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;e.preventDefault();e.stopPropagation();flushHistory();dragging=true;rootDragging=true;b.setPointerCapture(e.pointerId);b.focus()};
   b.onpointermove=e=>{if(dragging)moveRoot(k,point(canvases[view],e,state[view?'j':'m']))};
   const finish=()=>{if(!dragging)return;dragging=false;rootDragging=false;change(view);notice('rootsMoved')};b.onpointerup=finish;b.onpointercancel=finish;b.onlostpointercapture=finish;
   b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();flushHistory();const p=[...currentRoots()[k]],span=state[view?'j':'m'][2]*(e.shiftKey?.002:.02);p[0]+=(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0)*span;p[1]+=(e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0)*span;moveRoot(k,p);change(view);notice('rootsMoved')};
  })}
  roots.forEach((r,k)=>{const b=overlay.children[k],x=.5+(r[0]-v[0])/v[2],y=.5-(r[1]-v[1])/(v[2]*r.height/r.width);b.hidden=x<0||x>1||y<0||y>1;b.style.left=x*100+'%';b.style.top=y*100+'%';b.setAttribute('aria-label',tr('rootLabel',{n:k+1})+' · '+num(r[0])+' + '+num(r[1])+'i');b.title=b.getAttribute('aria-label')});
 }
}
$('memory').oninput=e=>{state.memory=+e.target.value;$('memoryOut').value=state.memory;change(2)};
$('newtonColor').onchange=e=>{state.nc=e.target.value;change(2)};
$('resetRoots').onclick=()=>{flushHistory();state.roots=[];change(2)};
function galleryScenes(){return [
 {name:'gPhoenix',family:'phoenix',c:[.56667,0],memory:-.5,p:presets.aurora,t:28,j:[0,0,3.2]},
 {name:'gPhoenixTwist',family:'phoenix',c:[-.150591292904,.472025031179],memory:-.5,p:presets.ember,t:24,j:[0,0,3.2]},
 {name:'gNewton',family:'newton',c:[0,0],degree:3,roots:[[1,.15],[-.65,.85],[-.35,-.65]],p:presets.dusk,t:26,m:[0,0,3.6],j:[0,0,1.4]},
 {name:'gNewtonFive',family:'newton',c:[0,0],degree:5,roots:[[1,.1],[.2,1],[-.9,.4],[-.5,-.8],[.6,-.5]],p:presets.aurora,t:24,m:[0,0,3.6],j:[0,0,1.4]},
 {name:'gJulia',family:'mandelbrot',c:[-.8,.156],p:presets.copper,t:30,j:[0,0,3.2]}
]}
function showGallery(){const scenes=galleryScenes();showList('gallery',scenes.map(s=>({q:encode({...initial(),...s,nc:'flow'}),at:0})));Array.from($('gallery').children).forEach((b,i)=>{const name=document.createElement('strong');name.className='gallery-name';name.textContent=tr(scenes[i].name);b.prepend(name);const restore=b.restore;b.restore=()=>{restore();scheduleHistory()}})}
window.addEventListener('hashchange',()=>{flushHistory();const view=new URLSearchParams(location.hash.slice(1)).get('view');sharedView=['0','1'].includes(view)?+view:null;state=decode(location.hash.slice(1));const l=new URLSearchParams(location.hash.slice(1)).get('lang');if(l){lang=interfaceLanguage(l);wikiLang=articleLanguage(l);applyLanguage()}sync();draw()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushHistory()});window.addEventListener('pagehide',flushHistory);
const resize=new ResizeObserver(draw);canvases.forEach(c=>resize.observe(c.parentElement));window.addEventListener('resize',draw);applyLanguage();draw();

$('showBoth').onclick=()=>{sharedView=null;sync();draw();persistURL()};
document.querySelectorAll('[data-share-view]').forEach(button=>button.onclick=async()=>{const link=new URL(location.href);link.hash=explorationURL(+button.dataset.shareView);try{await navigator.clipboard.writeText(link.href);notice('viewCopied')}catch{window.history.replaceState(null,'',link);sharedView=+button.dataset.shareView;sync();draw();notice('copyFallback')}});
function parseArchive(text){
 if(text.length>2000000)throw Error('size');const data=JSON.parse(text);
 if(data?.format!=='fractals-exploration'||data.version!==1||!Array.isArray(data.history)||!Array.isArray(data.saved)||data.history.length+data.saved.length>2000)throw Error('format');
 for(const entry of [...data.history,...data.saved]){if(!entry||typeof entry.q!=='string'||entry.q.length>10000)throw Error('entry');const p=new URLSearchParams(entry.q);if(!['c','m','j','p','family'].every(k=>p.has(k)))throw Error('query');const decoded=decode(entry.q);if(encode(decoded)!==entry.q)throw Error('invalid state')}
 return {history:validEntries(data.history),saved:validEntries(data.saved)};
}
function mergeEntries(incoming,current){const seen=new Set();return [...incoming,...current].filter(e=>{if(seen.has(e.q))return false;seen.add(e.q);return true})}
$('exportArchive').onclick=()=>{flushHistory();const text=JSON.stringify({format:'fractals-exploration',version:1,history,saved},null,2),url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='fractals-exploration.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notice('archiveExported')};
$('importArchive').onclick=()=>$('archiveFile').click();
$('archiveFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('size');const incoming=parseArchive(await file.text());flushHistory();history=mergeEntries(incoming.history,history).sort((a,b)=>b.at-a.at).slice(0,30);saved=mergeEntries(incoming.saved,saved);storeLists();showList('history',history);showList('saved',saved);notice(storageOK?'archiveImported':'storage')}catch{notice('archiveError')}finally{e.target.value=''}};


if(new URLSearchParams(location.search).has('touch-debug')){
 const panel=document.createElement('details');
 panel.open=true;
 panel.className='history';
 panel.innerHTML='<summary>Touch diagnostics</summary><p>Try one pinch on Mandelbrot and one on Julia, then copy the trace.</p><button type="button">Copy trace</button> <button type="button">Clear</button><br><textarea readonly rows="10" aria-label="Touch trace" style="width:100%;margin-top:8px"></textarea>';
 document.querySelector('main').append(panel);
 const output=panel.querySelector('textarea'),[copy,clear]=panel.querySelectorAll('button');
 const lines=[],lastMove=new Map();
 const started=performance.now();
 const trace=(channel,phase,data)=>{
  const now=performance.now(),key=channel+':'+phase;
  if(phase.endsWith('move')){
   if(now-(lastMove.get(key)??-Infinity)<140)return;
   lastMove.set(key,now);
  }
  lines.push(Math.round(now-started)+'ms '+channel+' '+phase+' '+data);
  if(lines.length>100)lines.shift();
  output.value=lines.join('\n');
 };
 globalThis.fractalTouchTrace=trace;
 const label=target=>target?.id||target?.tagName||'?';
 for(const type of ['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend']){
  document.addEventListener(type,event=>{
   if(panel.contains(event.target))return;
   const scene=event.target.closest?.('.scene')?.id||'outside';
   const touches=Array.from(event.touches||[],t=>t.identifier+'@'+label(t.target)).join(',');
   const changed=Array.from(event.changedTouches||[],t=>t.identifier+'@'+label(t.target)).join(',');
   trace('Safari '+scene,type,'target='+label(event.target)+' active=['+touches+'] changed=['+changed+'] pageScale='+visualViewport?.scale);
  },{capture:true,passive:true});
 }
 window.addEventListener('error',event=>{if(event.message)trace('Page','error',event.message)});
 copy.onclick=async()=>{try{await navigator.clipboard.writeText(output.value);copy.textContent='Copied'}catch{output.select();copy.textContent='Select and copy'}};
 clear.onclick=()=>{lines.length=0;lastMove.clear();output.value='';copy.textContent='Copy trace'};
 trace('Page','ready','nativeTouch='+('ontouchstart' in window)+' Mandelbrot span='+state.m[2]+' Julia span='+state.j[2]);
}

</script>
<script>
/* Optional GitHub metadata must never delay or interrupt the explorer. */
(async function loadGitHubStars(){
 const count=document.getElementById('github-star-count');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),5000);
 try{
  const response=await fetch('https://api.github.com/repos/mwouts/fractals',{signal:controller.signal,credentials:'omit',headers:{Accept:'application/vnd.github+json'}});
  if(!response.ok)return;
  const data=await response.json();
  if(!Number.isSafeInteger(data.stargazers_count)||data.stargazers_count<0)return;
  count.textContent=data.stargazers_count.toLocaleString();
  count.setAttribute('aria-label',count.textContent+' GitHub stars');
  count.hidden=false;
 }catch{
  // Keep the star link available when offline or GitHub rate-limits requests.
 }finally{clearTimeout(timeout)}
})();
</script></body></html>
